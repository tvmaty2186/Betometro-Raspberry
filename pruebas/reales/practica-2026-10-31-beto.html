    E(g,'line',{x1:X(a[1],W),y1:yv(a[2]),x2:X(b[1],W),y2:yv(b[2]),stroke:color(b),'stroke-width':3,'stroke-linecap':'round'})}

  const bw=Math.max(1.5,(W-36)/M.length*0.7);

  marcar(sel===null?Math.floor(M.length/3):sel);

function local(svg,ev){const r=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal;return{x:(ev.clientX-r.left)/r.width*vb.width,y:(ev.clientY-r.top)/r.height*vb.height}}
function tocar(s,f,arrastre){let ini=null,lado=false;

// barra de desplazamiento a la derecha: se arrastra con el dedo
(()=>{const b=$('barra'),th=b.querySelector('i');
