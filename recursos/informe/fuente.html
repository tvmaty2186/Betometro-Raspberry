<html lang="es"><head>

<title>Betómetro · __NOMBRE__</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%2316181B'/%3E%3Crect%20x='27'%20y='5'%20width='10'%20height='6'%20rx='2'%20fill='%23d7263d'/%3E%3Ccircle%20cx='32'%20cy='35'%20r='22'%20fill='none'%20stroke='%23d7263d'%20stroke-width='6'/%3E%3Cpath%20d='M44%2022a17%2017%200%200%201%205%2013'%20fill='none'%20stroke='%232ecc71'%20stroke-width='5'/%3E%3Cpath%20d='M32%2035L44%2024'%20stroke='%23f5c518'%20stroke-width='5'%20stroke-linecap='round'/%3E%3Ccircle%20cx='32'%20cy='35'%20r='4'%20fill='%23fff'/%3E%3C/svg%3E">
<style>
/* Tema Avispón Verde (Peugeot 404 #101), como la app y la pantalla de la Raspberry.
   Las tipografías y el león van adentro del archivo (se ve igual sin internet). */
@font-face{font-family:"Barlow";font-weight:600;font-style:normal;src:url(data:font/woff2;base64,__F_B600__) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-style:italic;src:url(data:font/woff2;base64,__F_B600I__) format("woff2")}
@font-face{font-family:"Barlow";font-weight:800;font-style:italic;src:url(data:font/woff2;base64,__F_B800I__) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;src:url(data:font/woff2;base64,__F_BC700__) format("woff2")}
:root{--bg:#0b2a17;--borde:#cfd4d8;--ink:#f7f7f2;--sub:#b9cdb8;--crema:#f3ead2;--rojo:#d7263d;--ama:#f4c531;--verde:#2ecc71;--azul:#3d8bfd;--celeste:#7fd3ff;
  --num:"Barlow Condensed","Arial Narrow",sans-serif;--ui:"Barlow",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;color:var(--ink);font-family:var(--ui);font-weight:600}
body{background:
  linear-gradient(180deg,rgba(11,42,23,0) 0,#0b2a17 260px),
  repeating-conic-gradient(#ffffff09 0 25%,transparent 0 50%) 0 0/22px 22px,
  radial-gradient(140% 70% at 50% 0%,#2f7a49,#0b2a17 70%);background-color:#0b2a17;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:0 30px 30px 14px}
/* Cabecera: león, BETÓMETRO cromado, rayas blancas y amarillas, línea amarilla */
.cab{position:relative;display:flex;align-items:center;gap:10px;padding:14px 0 12px;margin-bottom:12px;border-bottom:3px solid var(--ama);overflow:hidden}
.cab img{height:46px;width:auto;filter:drop-shadow(0 2px 2px #0008)}
.cab .bar{width:2px;height:40px;background:linear-gradient(#fff,#9aa3ad);transform:skewX(-18deg);opacity:.8}
.marca b{display:block;font:800 italic 26px/1 var(--ui);letter-spacing:.02em;
  background:linear-gradient(180deg,#ffffff 0%,#d9dde1 45%,#8d959c 55%,#e9ecef 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 1px #000a)}
.marca span{display:block;font:600 9px/1.4 var(--ui);letter-spacing:.2em;color:var(--sub);margin-top:3px}
.rayas{position:absolute;right:-6px;top:-10px;bottom:-4px;width:70px;
  background:linear-gradient(105deg,transparent 0 30%,#f7f7f2 30% 46%,transparent 46% 58%,var(--ama) 58% 74%,transparent 74%)}
h1{font:800 italic 30px/1.05 var(--ui);margin:4px 0 0;letter-spacing:.01em;
  background:linear-gradient(180deg,#ffffff 0%,#dfe3e6 48%,#9ea6ad 56%,#f1f3f5 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 1px #000b)}
.fecha{color:var(--sub);font-size:13px;margin:4px 0 14px;font-style:italic}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{cursor:pointer;padding:7px 12px;border-radius:99px;font:800 italic 14px var(--ui);background:#0f3b20;color:var(--crema);border:1.5px solid #cfd4d855;box-shadow:0 2px 4px #0006}
.chip.on{background:linear-gradient(#ffe07a,var(--ama) 50%,#d9a20f);color:#14240f;border-color:#fff}.chip small{opacity:.75;font-weight:600;font-style:normal;margin-left:4px}
.modo{padding:4px 10px;font-size:12px}
/* Tarjetas: cara de instrumento (fondo radial, borde cromado, reflejo arriba) */
.card{position:relative;background:radial-gradient(120% 90% at 50% 0%,#1f4a2f,#08190e);border-radius:18px;padding:12px;margin-bottom:12px;
  box-shadow:0 0 0 2px var(--borde),0 0 0 3px #4b5258,0 10px 18px #0008,inset 0 1px 0 #ffffff4d,inset 0 -18px 30px #00000073;overflow:hidden}
.card::after{content:"";position:absolute;left:8%;right:8%;top:3%;height:min(36%,110px);border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
  background:linear-gradient(#ffffff1c,#ffffff00);pointer-events:none}
.t{font-size:10px;letter-spacing:.16em;color:var(--sub);font-weight:600;font-style:italic;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px}
.t b{color:var(--crema);letter-spacing:0;font:700 14px var(--num);text-align:right}
svg{display:block;width:100%;height:auto;touch-action:pan-y}
.barra{position:fixed;top:6px;bottom:6px;right:3px;width:20px;border-radius:99px;background:#ffffff14;z-index:20;touch-action:none}
.barra i{position:absolute;left:3px;right:3px;border-radius:99px;background:#ffffff66;min-height:44px}
.barra.activa i{background:var(--ama)}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin-top:6px}.lg i{display:inline-block;width:14px;height:4px;border-radius:2px;vertical-align:middle;margin-right:4px}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.k div{background:radial-gradient(120% 90% at 50% 0%,#1f4a2f,#08190e);border-radius:12px;padding:8px 4px;text-align:center;box-shadow:0 0 0 1.5px var(--borde),0 4px 8px #0007,inset 0 -10px 16px #0006}
.k b{display:block;font:700 italic 24px/1 var(--num);color:var(--crema);font-variant-numeric:tabular-nums}.k span{font-size:9px;color:var(--sub);letter-spacing:.12em;font-weight:600}
.lect{position:sticky;top:0;z-index:5;background:#08190eee;border-radius:12px;padding:8px 6px;margin-bottom:12px;display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-variant-numeric:tabular-nums;
  box-shadow:0 0 0 1.5px var(--borde),0 6px 12px #000a}
.lect b{display:block;font:700 italic 20px/1.1 var(--num)}.lect span{font-size:9px;color:var(--sub);letter-spacing:.1em;font-weight:600}
.eje{fill:var(--sub);font-size:10px}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td{font-family:var(--num);font-weight:700;font-style:italic;font-size:17px}
th,td{padding:8px 4px;text-align:right;border-top:1px solid #ffffff1f}th{color:var(--sub);font-size:9px;letter-spacing:.1em;font-weight:600;border-top:0}
td:first-child,th:first-child,td:nth-child(2),th:nth-child(2){text-align:left}
td:nth-child(2){font:600 13px var(--ui)}
tr.sel td{background:#f4c5312e}tr.clic{cursor:pointer}
.tag{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.tipo{display:inline-block;font:800 italic 10px/1 var(--ui);letter-spacing:.08em;border-radius:20px;padding:5px 8px;border:1.5px solid}
.tipo.m{color:#ff6b5a;border-color:#ff6b5a;background:#d7263d2e}.tipo.l{color:#5fe08f;border-color:#5fe08f;background:#2ecc712e}.tipo.i{color:#b5bcc3;border-color:#8a929b}
.tot td{border-top:2px solid var(--ama);color:var(--crema);font:800 italic 15px var(--ui);padding-top:10px}.tot small{color:var(--sub);font-weight:600}
.tot td.grande{font:700 italic 28px/1 var(--num);color:var(--ama)}
.tot2 td{border-top:0;padding-top:0;color:var(--sub);font:600 italic 12px var(--ui);text-align:left}
.aviso{color:var(--sub);font-size:13px;text-align:center;padding:16px 6px}
.pie{text-align:center;color:var(--sub);font-size:11px;margin-top:14px;font-style:italic}
/* Video de la cámara (solo Raspberry): se ve cuando la página la sirve Betómetro en la red.
   Medidas en «u»: 1 u = 1 px con el video a 1280 de ancho (como las muestras aprobadas); en chico no baja de 0,55 px. */
.vw{container-type:inline-size;margin-top:2px}
.vid{--u:max(.55px,calc(100cqw / 1280));position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;color:#f4f1e6;box-shadow:0 0 0 1.5px #cfd4d855}
.vw:fullscreen{background:#000;display:flex;align-items:center}
.vw.fs{position:fixed;inset:0;z-index:50;margin:0;background:#000;display:flex;align-items:center}
.vw:fullscreen .vid,.vw.fs .vid{width:100%;height:100%;aspect-ratio:auto;border-radius:0;box-shadow:none}
.vid video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.vid .toque{position:absolute;inset:0;z-index:1}
.vid .no{display:none!important}
.ov{position:absolute;z-index:2;height:calc(52*var(--u));border-radius:calc(26*var(--u));border:calc(2*var(--u)) solid #cfd4d8;background:#08190ecc;
  display:flex;align-items:center;gap:calc(10*var(--u));padding:0 calc(18*var(--u));box-shadow:0 calc(6*var(--u)) calc(14*var(--u)) #0007;white-space:nowrap;touch-action:none}
.ov .e{font:800 italic calc(14*var(--u)) var(--ui);letter-spacing:.14em;color:#d6e6d2;text-transform:uppercase}
.ov .n{font:700 calc(38*var(--u))/1 var(--num);font-variant-numeric:tabular-nums}
.ov .u{font:700 calc(20*var(--u)) var(--num);color:#d6e6d2}
.ov .y{color:var(--ama)}
.ov.mov{opacity:.55;outline:calc(3*var(--u)) dashed var(--ama);outline-offset:calc(4*var(--u));z-index:6}
#ovChip{left:calc(22*var(--u));top:calc(18*var(--u));background:var(--ama);border-color:var(--ama);color:#111;font:800 italic calc(22*var(--u)) var(--ui)}
#ovAde{right:calc(22*var(--u));top:calc(18*var(--u))}
#ovTiempo{left:calc(22*var(--u));bottom:calc(208*var(--u))}
#ovDist{left:calc(22*var(--u));bottom:calc(146*var(--u))}
#ovVel{left:calc(22*var(--u));bottom:calc(84*var(--u))}
#ovPista{right:calc(22*var(--u));bottom:calc(84*var(--u));height:auto;border-radius:calc(18*var(--u));padding:calc(8*var(--u))}
#ovPista svg{width:calc(230*var(--u));height:calc(150*var(--u))}
@container (max-width:700px){#ovPista svg{width:calc(150*var(--u));height:calc(100*var(--u))}}
.vbarra{position:relative;width:calc(90*var(--u));height:calc(7*var(--u));border-radius:calc(4*var(--u));background:linear-gradient(90deg,#3d8bfd,#7fd3ff,#2fd162,#f4c531,#d23b2c)}
.vbarra i{position:absolute;left:50%;top:calc(-5*var(--u));width:calc(4*var(--u));height:calc(17*var(--u));margin-left:calc(-2*var(--u));background:#fff;border-radius:calc(2*var(--u));box-shadow:0 0 calc(3*var(--u)) #000}
.vgrande{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;width:calc(120*var(--u));height:calc(120*var(--u));border-radius:50%;
  background:#0008;border:calc(3*var(--u)) solid #fff;display:grid;place-items:center;pointer-events:none}
.vgrande i{width:0;height:0;border-left:calc(44*var(--u)) solid #fff;border-top:calc(28*var(--u)) solid transparent;border-bottom:calc(28*var(--u)) solid transparent;margin-left:calc(12*var(--u))}
.vbar{position:absolute;z-index:4;left:calc(22*var(--u));right:calc(22*var(--u));bottom:calc(18*var(--u));height:calc(52*var(--u));border-radius:calc(26*var(--u));
  background:#000a;border:calc(2*var(--u)) solid #cfd4d8;display:flex;align-items:center;gap:calc(16*var(--u));padding:0 calc(10*var(--u)) 0 calc(18*var(--u))}
.vbar button{all:unset;cursor:pointer;display:grid;place-items:center}
.vbar .pp svg{width:calc(26*var(--u));height:calc(26*var(--u))}
.vbar .hora{font:700 calc(26*var(--u)) var(--num);font-variant-numeric:tabular-nums}.vbar .hora.tot{opacity:.8}
.vlinea{flex:1;position:relative;height:calc(8*var(--u));border-radius:calc(4*var(--u));background:#ffffff33;cursor:pointer;touch-action:none}
.vlinea::before{content:"";position:absolute;left:0;right:0;top:calc(-16*var(--u));bottom:calc(-16*var(--u))}
.vlinea .avance{position:absolute;left:0;top:0;bottom:0;border-radius:calc(4*var(--u));background:var(--ama);pointer-events:none}
.vlinea .raya{position:absolute;top:calc(-8*var(--u));width:calc(3*var(--u));height:calc(24*var(--u));margin-left:calc(-1.5*var(--u));background:#fff}
.vlinea .raya::before{content:"";position:absolute;left:calc(-10*var(--u));right:calc(-10*var(--u));top:calc(-6*var(--u));bottom:calc(-6*var(--u))}
.vbar .eng{width:calc(42*var(--u));height:calc(42*var(--u));border-radius:50%;background:var(--ama);color:#111}
.vbar .eng svg{width:calc(28*var(--u));height:calc(28*var(--u))}
.vbar .eng.abierto{width:auto;border-radius:calc(21*var(--u));padding:0 calc(16*var(--u));font:800 italic calc(18*var(--u)) var(--ui)}
.vpanel{position:absolute;z-index:5;left:50%;bottom:calc(78*var(--u));transform:translateX(-50%);width:min(calc(620*var(--u)),calc(100% - 16px));max-height:calc(100% - 78*var(--u) - 8px);overflow:auto;
  background:#0c2415f2;border:calc(2*var(--u)) solid #cfd4d8;border-radius:calc(18*var(--u));padding:calc(16*var(--u)) calc(22*var(--u));box-shadow:0 10px 24px #000a}
.vpanel h3{margin:0 0 calc(6*var(--u));font:800 italic calc(24*var(--u)) var(--ui)}
.vpanel label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:calc(6*var(--u)) 0;border-bottom:1px solid #ffffff1f;font:800 italic calc(22*var(--u)) var(--ui);cursor:pointer}
.vpanel input{position:absolute;opacity:0;pointer-events:none}
.vpanel .sw{flex:none;position:relative;width:calc(96*var(--u));height:calc(44*var(--u));border-radius:calc(22*var(--u));background:#ffffff33;transition:background .15s}
.vpanel .sw::after{content:"";position:absolute;top:calc(4*var(--u));left:calc(4*var(--u));width:calc(36*var(--u));height:calc(36*var(--u));border-radius:50%;background:#e9ecef;transition:left .15s}
.vpanel input:checked+.sw{background:var(--ama)}.vpanel input:checked+.sw::after{left:calc(56*var(--u))}
.vpanel p{margin:calc(10*var(--u)) 0 0;font:600 calc(16*var(--u))/1.35 var(--ui);color:#d6e6d2}
.vpanel p a{color:var(--ama);cursor:pointer;text-decoration:underline}
.vguia{position:absolute;z-index:5;pointer-events:none;border:0 dashed var(--ama);opacity:.9}
.vguia.x{top:0;bottom:0;border-left-width:calc(2*var(--u))}.vguia.y{left:0;right:0;border-top-width:calc(2*var(--u))}
.vpega{position:absolute;z-index:6;pointer-events:none;font:800 italic calc(18*var(--u)) var(--ui);color:var(--ama);text-shadow:0 1px 3px #000;white-space:nowrap}
.vmsj{position:absolute;inset:0;z-index:3;display:grid;place-items:center;text-align:center;padding:20px;font:600 italic 14px var(--ui);color:var(--sub);background:#000c}
.vbajar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.vbajar a{flex:1;min-width:150px;text-align:center;text-decoration:none;padding:10px;border-radius:12px;border:2px solid var(--ama);color:var(--ama);font:800 italic 14px var(--ui)}
</style></head><body><main>
<div class="cab"><img alt="" src="data:image/png;base64,__LEON__"><div class="bar"></div>
  <div class="marca"><b>BETÓMETRO</b><span>REGULARIDAD PARA EL NAVEGANTE</span></div><div class="rayas"></div></div>
<h1 id="tit"></h1><div class="fecha" id="fecha"></div>
<div id="video"></div>
<div id="conRecorrido">
<div class="chips" id="vueltas"></div>
<div class="k" id="kpi"></div>
<div class="lect" id="lect"></div>
<div class="card"><div class="t">Recorrido de la vuelta</div><div class="chips" id="modos"></div>
  <svg id="mapa" viewBox="0 0 364 330"></svg><div class="lg" id="ley"></div></div>
<div class="card"><div class="t">Velocidad km/h<b id="vInfo"></b></div><svg id="gVel" viewBox="0 0 364 160"></svg></div>
<div class="card"><div class="t">Aceleración m/s²<b id="aInfo"></b></div><svg id="gAce" viewBox="0 0 364 150"></svg>
  <div class="lg"><span><i style="background:var(--verde)"></i>acelera</span><span><i style="background:var(--rojo)"></i>frena</span></div></div>
<div class="pie" style="margin:0 0 12px">tocá o deslizá el dedo sobre el mapa o los gráficos</div>
</div>
<div class="card"><div class="t">Todas las vueltas<b id="totInfo"></b></div><div id="tabla"></div></div>
<div class="pie">Generado con Betómetro · Avispón Verde #101</div>
</main>
<div class="barra" id="barra"><i></i></div>
<script>
const C=__DATOS__;
const NS='http://www.w3.org/2000/svg',$=id=>document.getElementById(id);
const E=(p,n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.append(e);return e};
const nf=(x,d)=>x.toFixed(d).replace('.',',');
const tfmt=ms=>{const s=Math.abs(ms)/1000,h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=(s%60).toFixed(1).padStart(4,'0').replace('.',',');return h?h+':'+String(m).padStart(2,'0')+':'+r:m+':'+r};
const dur=ms=>Math.abs(ms)<59950?nf(Math.abs(ms)/1000,1)+' s':tfmt(ms);
const dif=ms=>(ms>0?'+':ms<0?'−':'±')+dur(ms);
$('tit').textContent=C.nombre;
$('fecha').textContent=new Date(C.fecha+'T12:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+' · ideal '+tfmt(C.idealMs)+(C.distanciaM?' · '+C.distanciaM.toLocaleString('es-AR')+' m':'');
const vSug=C.distanciaM?C.distanciaM/(C.idealMs/1000)*3.6:null;
const conT=C.vueltas.map((v,i)=>i).filter(i=>C.vueltas[i].m);
let lap=conT.length?conT[0]:-1,modo='vel',sel=null;
const MODOS={vel:'Velocidad',ace:'Aceleración',ade:'Adelanto'};
const colVel=v=>{if(!vSug)return'var(--verde)';const d=v-vSug;return d>6?'var(--rojo)':d>2?'var(--ama)':d<-6?'var(--azul)':d<-2?'var(--celeste)':'var(--verde)'};
const colAce=a=>a>0.8?'var(--verde)':a>0.25?'#8fe3b0':a<-0.8?'var(--rojo)':a<-0.25?'#f08a96':'#9aa3ad';
const colAde=s=>{const a=Math.abs(s);return a<1?'var(--verde)':a<3?'var(--ama)':'var(--rojo)'};
const LEY={vel:[['var(--azul)','muy lento'],['var(--verde)','en sugerida'],['var(--ama)','rápido'],['var(--rojo)','muy rápido'],['#555','sin señal']],
 ace:[['var(--rojo)','frena fuerte'],['#9aa3ad','parejo'],['var(--verde)','acelera fuerte'],['#555','sin señal']],
 ade:[['var(--verde)','±1 s'],['var(--ama)','1 a 3 s'],['var(--rojo)','más de 3 s'],['#555','sin señal']]};
const color=p=>modo==='vel'?colVel(p[2]):modo==='ace'?colAce(p[3]):colAde(p[4]);
const nombreV=v=>'V'+v.n+(C.largadas>1?' L'+v.largada:'');
let irVideo=null;   // lo pone el reproductor de video (si la carrera tiene video y la página la sirve Betómetro)
// tabla con todas las vueltas
(()=>{let h='<table><tr><th>VUELTA</th><th>TIPO</th><th>TIEMPO</th><th>DIF.</th><th>PROM</th><th>MÁX</th></tr>';

 function elegir(k){cur=k;const x=VS[k];lps=C.vueltas.map((v,i)=>i).filter(i=>C.vueltas[i].video===k).sort((a,b)=>C.vueltas[a].videoMs-C.vueltas[b].videoMs);
  $('vMsj').classList.add('no');vv.src=url(x.archivo);vv.style.transform=x.girar&&x.espejo?'scaleY(-1)':x.girar?'rotate(180deg)':x.espejo?'scaleX(-1)':'';
  document.querySelectorAll('#vSel .chip').forEach(b=>b.classList.toggle('on',+b.dataset.k===k));$('vInfoV').textContent=nombreVid(k);rayas();actualizar()}
 if(VS.length>1)VS.forEach((x,k)=>{const b=document.createElement('button');b.className='chip';b.dataset.k=k;b.textContent=nombreVid(k);b.onclick=()=>elegir(k);$('vSel').append(b)});
 $('vBajar').innerHTML=VS.map((x,k)=>`<a href="${url(x.archivo)}?descargar=1" download="${x.archivo.replace(/"/g,'')}">Descargar video${VS.length>1?' · '+nombreVid(k):''}</a>`).join('');
 // ---- reproducir, pausa, pantalla completa ----
 let anim=0;const lazo=()=>{actualizar();anim=vv.paused?0:requestAnimationFrame(lazo)};
 const estado=()=>{const p=vv.paused;vid.classList.toggle('pausa',p);$('vPP').innerHTML=p?PLAY:PAUSA;$('vGrande').classList.toggle('no',!p);$('vEng').classList.toggle('no',!p);if(!p){panel(false);if(!anim)anim=requestAnimationFrame(lazo)}};
 const alternar=()=>{if(vv.paused){const pr=vv.play();if(pr&&pr.catch)pr.catch(()=>{})}else vv.pause()};
 ['play','pause','ended'].forEach(e=>vv.addEventListener(e,estado));
 ['timeupdate','seeked','loadeddata'].forEach(e=>vv.addEventListener(e,actualizar));
 vv.addEventListener('loadedmetadata',()=>{rayas();actualizar()});
 vv.addEventListener('error',()=>{const m=$('vMsj');m.classList.remove('no');m.textContent=vv.error&&vv.error.code===4?'Este navegador no puede abrir el video. Probá con Chrome, o descargalo.':'No se pudo abrir el video (¿se borró?).'});
 $('vPP').onclick=alternar;
 const completa=()=>{const fs=document.fullscreenElement||document.webkitFullscreenElement;
  if(fs){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
  if(vw.classList.contains('fs')){vw.classList.remove('fs');return}
  const f=vw.requestFullscreen||vw.webkitRequestFullscreen;
  if(f){const r=f.call(vw);if(r&&r.then)r.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>vw.classList.add('fs'))}else vw.classList.add('fs')};
 let toque=null;
 $('vToque').addEventListener('click',()=>{if(toque){clearTimeout(toque);toque=null;completa();return}
  toque=setTimeout(()=>{toque=null;if(!$('vPanel').classList.contains('no'))panel(false);else alternar()},280)});
 document.addEventListener('keydown',ev=>{if(ev.key==='Escape')vw.classList.remove('fs')});
 // ---- configuración (solo en pausa): prender/apagar cada dato y moverlos ----
 const mostrar=()=>DATOS.forEach(([k])=>$(ID[k]).classList.toggle('no',guardado.ocultos.includes(k)||(k==='ade'&&!C.distanciaM)||(k==='pista'&&!!$('ovPista').dataset.sin)));
 function panel(abrir){const P=$('vPanel'),b=$('vEng');P.classList.toggle('no',!abrir);b.classList.toggle('abierto',abrir);b.innerHTML=abrir?'✎ Datos':ENG;
  if(!abrir)return;
  P.innerHTML='<h3>Datos sobre el video</h3>'+DATOS.filter(([k])=>!(k==='ade'&&!C.distanciaM)).map(([k,t])=>`<label>${t}<input type="checkbox" data-k="${k}" ${guardado.ocultos.includes(k)?'':'checked'}><span class="sw"></span></label>`).join('')+
   '<p>Mantené apretado un dato para moverlo · se pega a los otros y a los bordes. <a id="vReset">Volver a como venía</a></p>';
  P.querySelectorAll('input').forEach(i=>i.onchange=()=>{const k=i.dataset.k;guardado.ocultos=guardado.ocultos.filter(x=>x!==k);if(!i.checked)guardado.ocultos.push(k);guardar();mostrar()});
  $('vReset').onclick=()=>{guardado={ocultos:[],pos:{}};guardar();DATOS.forEach(([k])=>{const e=$(ID[k]);e.style.left=e.style.top=e.style.right=e.style.bottom=''});mostrar();panel(true)}}
 $('vEng').onclick=()=>panel($('vPanel').classList.contains('no'));
 const ponerPos=()=>{const W=vid.clientWidth,H=vid.clientHeight;DATOS.forEach(([k])=>{const p=guardado.pos[k],e=$(ID[k]);if(!p)return;
  e.style.right=e.style.bottom='auto';e.style.left=Math.max(0,Math.min(W-e.offsetWidth,p.x*W))+'px';e.style.top=Math.max(0,Math.min(H-e.offsetHeight,p.y*H))+'px'})};
 addEventListener('resize',ponerPos);document.addEventListener('fullscreenchange',()=>setTimeout(ponerPos,60));
 DATOS.forEach(([k])=>{const e=$(ID[k]);let reloj=null,ini=null,mov=false,dx=0,dy=0;
  const limpiar=()=>vid.querySelectorAll('.vguia,.vpega').forEach(g=>g.remove());
  e.addEventListener('pointerdown',ev=>{if(!vv.paused)return;ini={x:ev.clientX,y:ev.clientY};ev.preventDefault();
   reloj=setTimeout(()=>{reloj=null;mov=true;e.classList.add('mov');try{e.setPointerCapture(ev.pointerId)}catch(_){}const r=e.getBoundingClientRect();dx=ini.x-r.left;dy=ini.y-r.top},420)});
  e.addEventListener('pointermove',ev=>{if(reloj&&ini&&Math.hypot(ev.clientX-ini.x,ev.clientY-ini.y)>8){clearTimeout(reloj);reloj=null}
   if(!mov)return;const R=vid.getBoundingClientRect(),W=R.width,H=R.height,w=e.offsetWidth,h=e.offsetHeight,u=parseFloat(getComputedStyle(vid).getPropertyValue('--u'))||W/1280;
   let x=ev.clientX-R.left-dx,y=ev.clientY-R.top-dy;const um=Math.max(8,14*u),mg=22*u,sep=10*u,barra=(18+52+14)*u;
   // imán: bordes del video y los otros datos (alinear bordes o ponerse al lado)
   const otros=DATOS.map(([j])=>j).filter(j=>j!==k&&!$(ID[j]).classList.contains('no')).map(j=>{const o=$(ID[j]),q=o.getBoundingClientRect();return{j,l:q.left-R.left,t:q.top-R.top,r:q.right-R.left,b:q.bottom-R.top}});
   let bx=null,by=null;const prueba=(pos,ref,de,es,eje)=>{const d=Math.abs(pos-ref);const m=eje==='x'?bx:by;if(d<um&&(!m||d<m.d)){const n={d,v:ref-(pos-(eje==='x'?x:y)),linea:ref,de};if(eje==='x')bx=n;else by=n}};
   prueba(x,mg,null,0,'x');prueba(x+w,W-mg,null,0,'x');prueba(y,mg,null,0,'y');prueba(y+h,H-barra,null,0,'y');
   otros.forEach(o=>{prueba(x,o.l,o.j,0,'x');prueba(x+w,o.r,o.j,0,'x');prueba(x,o.r+sep,o.j,0,'x');prueba(x+w,o.l-sep,o.j,0,'x');
    prueba(y,o.t,o.j,0,'y');prueba(y+h,o.b,o.j,0,'y');prueba(y,o.b+sep,o.j,0,'y');prueba(y+h,o.t-sep,o.j,0,'y')});
   if(bx)x=bx.v;if(by)y=by.v;x=Math.max(0,Math.min(W-w,x));y=Math.max(0,Math.min(H-h,y));
   e.style.right=e.style.bottom='auto';e.style.left=x+'px';e.style.top=y+'px';
   limpiar();const g=(c,v)=>{const d=document.createElement('div');d.className='vguia '+c;d.style[c==='x'?'left':'top']=v+'px';vid.append(d)};
   if(bx)g('x',bx.linea);if(by)g('y',by.linea);const de=(by&&by.de)||(bx&&bx.de);
   if(de){const l=document.createElement('div');l.className='vpega';l.textContent='se pega a «'+NOMBRE[de]+'»';l.style.left=x+'px';l.style.top=(y+h+8*u>H-barra-20*u?y-26*u:y+h+8*u)+'px';vid.append(l)}});
  const fin=()=>{if(reloj){clearTimeout(reloj);reloj=null}ini=null;if(!mov)return;mov=false;e.classList.remove('mov');limpiar();
   guardado.pos[k]={x:e.offsetLeft/vid.clientWidth,y:e.offsetTop/vid.clientHeight};guardar()};
  e.addEventListener('pointerup',fin);e.addEventListener('pointercancel',fin);e.addEventListener('contextmenu',ev=>ev.preventDefault())});
 // ---- desde el informe: una vuelta de la tabla o un punto del mapa llevan el video ahí ----
 irVideo=(i,t)=>{const v=C.vueltas[i];if(!v||v.video==null||!VS[v.video])return;if(v.video!==cur)elegir(v.video);
  const ms=v.videoMs+(t||0)*1000;if(vv.readyState>=1)ir(ms);else vv.addEventListener('loadedmetadata',()=>ir(ms),{once:true})};
 $('vEng').innerHTML=ENG;mostrar();elegir(0);estado();setTimeout(ponerPos,0);
})();
</script></body></html>
