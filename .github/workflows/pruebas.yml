name: Pruebas

on:
  push:
  pull_request:

jobs:
  pc:
    name: Núcleo en PC (con controles de memoria)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compilar
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build -j 4
      - name: Pruebas (motor igual a la app + núcleo)
        run: ctest --test-dir build --output-on-failure
      - name: Informe de la comparación
        if: always()
        run: cat build/comparacion-motor.md >> "$GITHUB_STEP_SUMMARY" || true

  arm:
    name: Núcleo en ARM 64 bits (como la Raspberry)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Compilar
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
      - name: Pruebas
        run: ctest --test-dir build --output-on-failure

  programa:
    # En debian:trixie (mismo Qt 6.8.2 y GStreamer que la Raspberry): antes usaba Qt 6.8.3 de afuera y estaba
    # roto hace 9 versiones (09-2.b). Corre todas las pruebas, también la cámara de prueba y el video.
    name: Programa Qt (Debian trixie, todas las pruebas)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas
        run: docker run --rm -v "$PWD:/src" debian:trixie bash /src/raspios/pruebas.sh
