name: Programa para Raspberry Pi OS

# Compila Betómetro para Raspberry Pi OS Lite 64 bits (Debian trixie) y lo prueba antes de
# entregarlo. Sale un .zip con el instalador: se copia a la Raspberry y se corre
# «sudo bash instalar.sh». Tarda unos minutos (no arma un sistema entero como imagen.yml).
# Con una etiqueta vX.Y.Z (igual a la versión de CMakeLists.txt) además se publica en el repo
# público Betometro-actualizaciones, de donde la Raspberry baja las actualizaciones sola.
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'app/**'
      - 'recursos/**'
      - 'voz/**'
      - 'raspios/**'
      - 'CMakeLists.txt'
      - '.github/workflows/programa.yml'

concurrency:
  group: programa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  programa:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Caché (voz y compilación)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/betometro-voz
            .ccache
          key: programa-${{ github.run_id }}
          restore-keys: programa-

      - name: Voz (Elena y Tomás)
        run: |
          pip install --break-system-packages edge-tts
          python3 voz/grabar.py salida-pi/voz

      - name: Simulador de ARM (la Raspberry es arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Compilar (Debian trixie arm64, como Raspberry Pi OS)
        run: docker run --rm --platform linux/arm64 -v "$PWD:/src" debian:trixie bash /src/raspios/compilar.sh

      - name: Probar en un sistema limpio
        run: docker run --rm --platform linux/arm64 -v "$PWD:/src" debian:trixie bash /src/raspios/probar.sh

      - name: Armar el paquete
        run: |
          V=$(grep -oP 'project\(betometro VERSION \K[0-9.]+' CMakeLists.txt)
          echo "V=$V" >> "$GITHUB_ENV"
          sudo chown -R "$USER" salida-pi .ccache
          P=salida-pi/betometro-pi-$V
          mkdir -p "$P"
          tar -C salida-pi/raiz -czf "$P/betometro.tar.gz" usr
          cp raspios/instalar.sh raspios/paquetes.txt raspios/*.service "$P/"
          echo "$V ($(git rev-parse --short HEAD))" > "$P/version.txt"
          ls -la "$P"
          # Paquete para Ajustes → Actualizar (internet o pendrive)
          tar -C salida-pi -czf "salida-pi/betometro-pi-$V.tar.gz" "betometro-pi-$V"

      - uses: actions/upload-artifact@v4
        with:
          name: betometro-pi-${{ env.V }}
          path: salida-pi/betometro-pi-${{ env.V }}
          retention-days: 30

      - name: Publicar en Betometro-actualizaciones (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.ACTUALIZACIONES_TOKEN }}
        run: |
          test "${GITHUB_REF_NAME#v}" = "$V" || { echo "La etiqueta ($GITHUB_REF_NAME) no coincide con la versión de CMakeLists.txt ($V)"; exit 1; }
          git log -1 --format=%B > notas.txt
          gh release create "v$V" "salida-pi/betometro-pi-$V.tar.gz" \
            --repo tvmaty2186/Betometro-actualizaciones --title "Betómetro $V" --notes-file notas.txt
