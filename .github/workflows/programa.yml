name: Programa para Raspberry Pi OS

# Compila Betómetro para Raspberry Pi OS Lite 64 bits (Debian trixie) y lo prueba antes de
# entregarlo. Sale un .zip con el instalador: se copia a la Raspberry y se corre
# «sudo bash instalar.sh». Tarda unos minutos (no arma un sistema entero como imagen.yml).
# Se publica en el repo público Betometro-actualizaciones (de donde la Raspberry baja las
# actualizaciones sola) con: «[publicar]» en el mensaje del commit, el botón «Run workflow» con
# «publicar» tildado, o una etiqueta vX.Y.Z. La versión es la de CMakeLists.txt.
on:
  workflow_dispatch:
    inputs:
      publicar:
        description: 'Publicar en Betometro-actualizaciones'
        type: boolean
        default: false
  push:
    # Solo desde main (Matías, 07/11/2026): las otras ramas no compilan (10, pregunta 4)
    branches: ['main']
    tags: ['v*']
    paths:
      - 'app/**'
      - 'recursos/**'
      - 'voz/**'
      - 'raspios/**'
      - 'CMakeLists.txt'
      - '.github/workflows/programa.yml'

# Un empuje nuevo cancela la compilación anterior, salvo si esa era para publicar: cada [publicar] va en
# su propio grupo y nada la corta (10-2.2)
concurrency:
  group: programa-${{ github.ref }}-${{ (contains(github.event.head_commit.message, '[publicar]') || inputs.publicar || startsWith(github.ref, 'refs/tags/v')) && github.run_id || 'x' }}
  cancel-in-progress: true

jobs:
  programa:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      PUBLICAR: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publicar || contains(github.event.head_commit.message, '[publicar]') }}
    steps:
      - uses: actions/checkout@v4

      # Primero todas las pruebas (PC, Debian trixie): si una falla, se corta acá y no se publica (09-1.1)
      - name: Pruebas (si una falla, no se publica)
        timeout-minutes: 40
        run: docker run --rm -v "$PWD:/src" debian:trixie bash /src/raspios/pruebas.sh

      # El paquete para la Raspberry (ARM, emulado: lo lento) solo cuando se publica (Matías, 07/11/2026)
      - name: Caché (voz y compilación)
        if: env.PUBLICAR == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/betometro-voz
            .ccache
          key: programa-${{ github.run_id }}
          restore-keys: programa-

      - name: Voz (Elena y Tomás)
        if: env.PUBLICAR == 'true'
        # Normalmente menos de 1 minuto. El 06/11/2026 apt se quedó colgado 17 min sin decir nada:
        # ahora cada parte tiene tiempo límite, se reintenta y se ve lo que hace.
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            sudo timeout 240 apt-get -o Acquire::Retries=3 -o DPkg::Lock::Timeout=60 install -y -q --no-install-recommends ffmpeg && break
            echo "apt no anduvo (intento $i), actualizo la lista y reintento"
            sudo timeout 180 apt-get update -q || true
          done
          command -v ffmpeg
          # Versión fija (11B-3): la última de PyPI el 07/11/2026. Si edge-tts deja de andar (Microsoft cambia la
          # API), subirla acá a propósito, no que cambie sola en cada compilación.
          timeout 180 pip install --break-system-packages edge-tts==7.3.1
          timeout 600 python3 voz/grabar.py salida-pi/voz

      - name: Simulador de ARM (la Raspberry es arm64)
        if: env.PUBLICAR == 'true'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Compilar (Debian trixie arm64, como Raspberry Pi OS)
        if: env.PUBLICAR == 'true'
        run: docker run --rm --platform linux/arm64 -v "$PWD:/src" debian:trixie bash /src/raspios/compilar.sh

      - name: Probar en un sistema limpio
        if: env.PUBLICAR == 'true'
        run: docker run --rm --platform linux/arm64 -v "$PWD:/src" debian:trixie bash /src/raspios/probar.sh

      - name: Armar el paquete
        if: env.PUBLICAR == 'true'
        run: |
          V=$(grep -oP 'project\(betometro VERSION \K[0-9.]+' CMakeLists.txt)
          echo "V=$V" >> "$GITHUB_ENV"
          sudo chown -R "$USER" salida-pi .ccache
          P=salida-pi/betometro-pi-$V
          mkdir -p "$P"
          tar -C salida-pi/raiz -czf "$P/betometro.tar.gz" usr
          cp raspios/instalar.sh raspios/paquetes.txt raspios/*.service "$P/"
          cp -r raspios/arranque "$P/"
          echo "$V ($(git rev-parse --short HEAD))" > "$P/version.txt"
          ls -la "$P"
          # Paquete para Ajustes → Actualizar (internet o pendrive)
          tar -C salida-pi -czf "salida-pi/betometro-pi-$V.tar.gz" "betometro-pi-$V"

      - if: env.PUBLICAR == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: betometro-pi-${{ env.V }}
          path: salida-pi/betometro-pi-${{ env.V }}
          retention-days: 30

      - if: env.PUBLICAR == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: capturas-${{ env.V }}
          path: salida-pi/capturas
          retention-days: 30

      - name: Publicar en Betometro-actualizaciones
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publicar || contains(github.event.head_commit.message, '[publicar]')
        env:
          GH_TOKEN: ${{ secrets.ACTUALIZACIONES_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$V" || { echo "La etiqueta ($GITHUB_REF_NAME) no coincide con la versión de CMakeLists.txt ($V)"; exit 1; }
          fi
          if gh release view "v$V" --repo tvmaty2186/Betometro-actualizaciones >/dev/null 2>&1; then
            echo "La versión $V ya está publicada: subí el número en CMakeLists.txt"; exit 1
          fi
          git log -1 --format=%B | grep -v -e '^Co-Authored-By' -e '^Claude-Session' | sed 's/ *\[publicar\]//' > notas.txt
          gh release create "v$V" "salida-pi/betometro-pi-$V.tar.gz" \
            --repo tvmaty2186/Betometro-actualizaciones --title "Betómetro $V" --notes-file notas.txt
