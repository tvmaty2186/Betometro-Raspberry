name: Imagen para la Raspberry

# Arma la imagen completa (Buildroot): betometro-X.Y.Z.img.xz para grabar con Raspberry Pi Imager.
# Tarda: la primera vez unas 3 horas; después, con la caché, bastante menos.
on:
  workflow_dispatch:
  # Solo cuando se pide: un commit con «[imagen]» en el mensaje, o una etiqueta v* (versión).
  # Así, mientras se programa, no se gastan horas de GitHub en imágenes que nadie va a usar.
  push:
    branches: ['**']
    tags: ['v*']

env:
  BUILDROOT: 2026.02.3

# Una a la vez: si hay una armándose, la nueva espera (y aprovecha su caché)
concurrency:
  group: imagen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  imagen:
    if: startsWith(github.ref, 'refs/tags/v') || contains(github.event.head_commit.message, '[imagen]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Hacer lugar en el disco (Buildroot con Qt necesita unos 25 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential rsync cpio unzip bc file wget python3 python3-pip libncurses-dev

      - name: Caché de descargas y compilación
        uses: actions/cache/restore@v4
        with:
          path: |
            sistema/cache
            ~/.cache/betometro-voz
          key: buildroot-${{ env.BUILDROOT }}-${{ hashFiles('sistema/configs/*', 'sistema/board/rpi3/linux.fragment') }}-${{ github.run_id }}
          restore-keys: |
            buildroot-${{ env.BUILDROOT }}-${{ hashFiles('sistema/configs/*', 'sistema/board/rpi3/linux.fragment') }}-
            buildroot-${{ env.BUILDROOT }}-

      - name: Voz (Piper)
        run: |
          pip install --break-system-packages piper-tts
          python3 voz/grabar.py sistema/voz-grabada

      - name: Buildroot
        run: |
          wget -q https://buildroot.org/downloads/buildroot-${BUILDROOT}.tar.xz
          tar xf buildroot-${BUILDROOT}.tar.xz
          make -C buildroot-${BUILDROOT} BR2_EXTERNAL=$PWD/sistema O=$PWD/salida betometro_rpi3_defconfig

      - name: Compilar la imagen
        timeout-minutes: 320   # corta antes que el trabajo, así se guarda la caché y la próxima sigue desde ahí
        run: |
          set +e +o pipefail
          make -C salida -j$(nproc) 2>&1 | tee compilacion.log | grep -E '^>>>|[Ee]rror'
          exit ${PIPESTATUS[0]}

      - name: Guardar la caché (también si falló o se cortó)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            sistema/cache
            ~/.cache/betometro-voz
          key: buildroot-${{ env.BUILDROOT }}-${{ hashFiles('sistema/configs/*', 'sistema/board/rpi3/linux.fragment') }}-${{ github.run_id }}

      - name: Registro de la compilación (si falló)
        if: failure() || cancelled()
        run: tail -n 300 compilacion.log

      - name: Nombre con la versión
        id: v
        run: |
          V=$(grep -oP 'project\(betometro VERSION \K[0-9.]+' CMakeLists.txt)
          cp salida/images/betometro.img.xz betometro-$V.img.xz
          echo "version=$V" >> "$GITHUB_OUTPUT"
          ls -la salida/images

      # Paquete de actualización (.raucb), firmado con la clave del secreto RAUC_CLAVE.
      # Lo instala la Raspberry por wifi o desde un pendrive. Sin el secreto, no se arma.
      - name: Paquete de actualización
        env:
          RAUC_CLAVE: ${{ secrets.RAUC_CLAVE }}
        run: |
          if [ -z "$RAUC_CLAVE" ]; then echo "Sin el secreto RAUC_CLAVE: no se arma el paquete"; exit 0; fi
          V=${{ steps.v.outputs.version }}
          export PATH="$PWD/salida/host/bin:$PWD/salida/host/sbin:$PATH"   # rauc usa mksquashfs de Buildroot
          umask 077
          printf '%s\n' "$RAUC_CLAVE" > clave.pem
          mkdir -p paquete
          cp salida/images/rootfs.squashfs paquete/
          cp sistema/board/rpi3/rauc/hook.sh paquete/
          printf '[update]\ncompatible=betometro-rpi3\nversion=%s\n\n[bundle]\nformat=verity\n\n[hooks]\nfilename=hook.sh\n\n[image.rootfs]\nfilename=rootfs.squashfs\nhooks=post-install\n' "$V" > paquete/manifest.raucm
          salida/host/bin/rauc bundle --cert=sistema/board/rpi3/rauc/certificado.pem --key=clave.pem paquete betometro-$V.raucb
          rm -f clave.pem
          salida/host/bin/rauc info --keyring=sistema/board/rpi3/rauc/certificado.pem betometro-$V.raucb

      - uses: actions/upload-artifact@v4
        with:
          name: betometro-${{ steps.v.outputs.version }}
          path: |
            betometro-${{ steps.v.outputs.version }}.img.xz
            betometro-${{ steps.v.outputs.version }}.raucb
          if-no-files-found: warn
          retention-days: 30

      - name: Publicar en la versión (solo con etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            betometro-${{ steps.v.outputs.version }}.img.xz
            betometro-${{ steps.v.outputs.version }}.raucb
