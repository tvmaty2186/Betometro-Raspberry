# Tarjeta de Betómetro: arranque, sistema A, sistema B (para actualizar) y datos.
image boot.vfat {
	vfat {
		files = {
			"bcm2710-rpi-3-b.dtb",
			"bcm2710-rpi-3-b-plus.dtb",
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/cmdline.txt",
			"rpi-firmware/config.txt",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/start.elf",
			"rpi-firmware/overlays",
			"u-boot.bin",
			"boot.scr"
		}
		# El kernel de cada copia del sistema (U-Boot carga el de la copia elegida).
		# Las actualizaciones reemplazan el de la copia que instalan.
		file a/Image { image = "Image" }
		file b/Image { image = "Image" }
	}
	size = 128M   # firmware, U-Boot y dos kernels (uno por copia)
}

image betometro.img {
	hdimage {
	}

	partition arranque {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition sistemaA {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 600M
	}

	# De fábrica, B es igual a A: si A no arrancara, U-Boot pasa a B
	partition sistemaB {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 600M
	}

	# Se agranda sola al primer arranque hasta llenar la tarjeta
	partition datos {
		partition-type = 0x83
		image = "datos.ext4"
	}
}
