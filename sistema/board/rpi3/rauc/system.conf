# RAUC: actualizaciones firmadas en dos copias del sistema (A y B)
[system]
compatible=betometro-rpi3
bootloader=uboot
data-directory=/datos/rauc
bundle-formats=-plain

[keyring]
path=/etc/rauc/certificado.pem

[slot.rootfs.0]
device=/dev/mmcblk0p2
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=raw
bootname=B
